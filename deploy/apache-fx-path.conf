# Snippet: serve JM Forex under https://jmtechsolution.cloud/fx/
# Include inside the existing JM TECH SSL VirtualHost BEFORE the catch-all ProxyPass /

# WebSocket live feed
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/fx/api/ws(.*)$  ws://127.0.0.1:8000/api/ws$1 [P,L]

ProxyPass        /fx/api/ws   ws://127.0.0.1:8000/api/ws
ProxyPassReverse /fx/api/ws   ws://127.0.0.1:8000/api/ws

ProxyPass        /fx/         http://127.0.0.1:8000/
ProxyPassReverse /fx/         http://127.0.0.1:8000/
