# Apache reverse proxy for JM Forex desk
# Install on VPS:
#   sudo cp deploy/apache-forex.jmtechsolution.cloud.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo a2ensite apache-forex.jmtechsolution.cloud.conf
#   sudo certbot --apache -d forex.jmtechsolution.cloud
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName forex.jmtechsolution.cloud
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName forex.jmtechsolution.cloud

    SSLEngine on
    # Certbot will manage these paths after: certbot --apache -d forex.jmtechsolution.cloud
    # SSLCertificateFile /etc/letsencrypt/live/forex.jmtechsolution.cloud/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/forex.jmtechsolution.cloud/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket for live ticks/signals
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /api/ws(.*)           ws://127.0.0.1:8000/api/ws$1 [P,L]

    ProxyPass        /api/ws         ws://127.0.0.1:8000/api/ws
    ProxyPassReverse /api/ws         ws://127.0.0.1:8000/api/ws

    ProxyPass        /               http://127.0.0.1:8000/
    ProxyPassReverse /               http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/forex-error.log
    CustomLog ${APACHE_LOG_DIR}/forex-access.log combined
</VirtualHost>
