# Snippet: serve JM Lab (static) under https://jmtechsolution.cloud/lab/
# Include in the SAME SSL VirtualHost as /fx/, BEFORE any catch-all ProxyPass /
#
# Lab is static files only — does NOT proxy to jm-forex.service.
# JM FX desk stays at /fx/ (unchanged).

Alias /lab /opt/jm-lab/dist

<Directory /opt/jm-lab/dist>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# SPA: /lab/compare → index.html (hash routes handled client-side; assets under /lab/assets/)
RewriteRule ^/lab$ /lab/ [R=301,L]

# If a file/dir under /lab/ does not exist, serve index.html for client routing
RewriteCond %{REQUEST_URI} ^/lab/ [NC]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule ^/lab/.* /lab/index.html [L]
