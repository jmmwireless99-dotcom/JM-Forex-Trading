# Snippet: JM Lab UI + demo trading API under https://jmtechsolution.cloud/lab/
# MUST be included INSIDE the SSL VirtualHost, BEFORE catch-all ProxyPass /
#
# Lab API proxy must appear before ProxyPass /lab ! (static exclusion).

    # JM Lab demo trading API → port 8001 (isolated from JM FX /fx/)
    ProxyPass /lab/api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /lab/api/ http://127.0.0.1:8001/api/

    # JM Lab static /lab/ (experiments — does not touch /fx/)
    Alias /lab /opt/jm-lab/dist
    <Directory /opt/jm-lab/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    RewriteRule ^/lab$ /lab/ [R=301,L]
    # Pair demo URLs (/lab/EURUSD, /lab/audnzd, …) → SPA
    RewriteCond %{REQUEST_URI} ^/lab/(EURUSD|GBPUSD|AUDNZD|EURCHF)/?$ [NC]
    RewriteRule ^ /lab/index.html [L]
    ProxyPass /lab !
