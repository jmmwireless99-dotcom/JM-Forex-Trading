# Snippet: JM Lab UI + demo trading API under https://jmtechsolution.cloud/lab/
# MUST be included INSIDE the SSL VirtualHost, BEFORE catch-all ProxyPass /
#
# Lab API proxy must appear before ProxyPass /lab ! (static exclusion).

    # JM Lab demo trading API → port 8001 (isolated from JM FX /fx/)
    ProxyPass /lab/api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /lab/api/ http://127.0.0.1:8001/api/

    # JM Lab static /lab/ (experiments — does not touch /fx/)
    Alias /lab /opt/jm-lab/dist
    <Directory /opt/jm-lab/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        # Never serve index.html for missing /lab/assets/* — browser needs real 404 on JS/CSS
        RewriteCond %{REQUEST_URI} ^/lab/assets/ [NC]
        RewriteRule ^ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
        <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </Files>
    </Directory>
    RewriteRule ^/lab$ /lab/ [R=301,L]
    # Exclude ALL /lab/* from JM TECH Express catch-all (not just /lab exact)
    ProxyPass /lab/ !
    ProxyPass /lab !
