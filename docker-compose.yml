services:
  jm-forex:
    build: .
    container_name: jm-forex
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      JM_APP_NAME: "JM Forex"
      JM_DEFAULT_STRATEGY: gold_confluence
      JM_DEFAULT_SYMBOLS: XAUUSD
      JM_INITIAL_BALANCE: "1000"
      JM_MAX_RISK_PER_TRADE_PCT: "0.5"
      JM_MAX_OPEN_POSITIONS: "1"
      JM_SESSION_FILTER: "true"
      JM_NEWS_FILTER: "true"
      JM_EXECUTION_MODE: paper
      JM_STATIC_DIR: /app/static
    volumes:
      # Optional: mount MT4 bridge folder if available on this host
      - jm_forex_data:/data

volumes:
  jm_forex_data:
