name: Deploy JM FX to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/deploy-fx-portal.sh'
      - '.github/workflows/deploy-vps.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.JM_VPS_HOST || '72.62.73.235' }}
          USER: ${{ secrets.JM_VPS_USER }}
          PASSWORD: ${{ secrets.JM_VPS_SSH_PASSWORD }}
          KEY: ${{ secrets.JM_VPS_SSH_KEY }}
          BRANCH: main
        run: |
          set -euo pipefail
          if [[ -z "${USER:-}" ]]; then
            echo "Add GitHub secret JM_VPS_USER (e.g. root)"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          if [[ -n "${KEY:-}" ]]; then
            KEY_FILE="$(mktemp)"
            printf '%s\n' "$KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            SSH_OPTS+=(-i "$KEY_FILE")
            SSH=(ssh "${SSH_OPTS[@]}" "${USER}@${HOST}")
          elif [[ -n "${PASSWORD:-}" ]]; then
            SSH=(sshpass -p "$PASSWORD" ssh "${SSH_OPTS[@]}" -o PreferredAuthentications=password -o PubkeyAuthentication=no "${USER}@${HOST}")
          else
            echo "Add GitHub secret JM_VPS_SSH_PASSWORD or JM_VPS_SSH_KEY"
            exit 1
          fi
          "${SSH[@]}" "set -euo pipefail
            cd /opt/jm-forex-trading
            export BRANCH='${BRANCH}'
            git fetch origin \"\${BRANCH}\"
            git checkout -B \"\${BRANCH}\" \"origin/\${BRANCH}\"
            git reset --hard \"origin/\${BRANCH}\"
            chmod +x scripts/deploy-fx-portal.sh
            ./scripts/deploy-fx-portal.sh
          "
      - name: Live smoke check
        run: |
          curl -fsS "https://jmtechsolution.cloud/fx/api/health"
          curl -fsS "https://jmtechsolution.cloud/fx/api/auto" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);af=d.get('auto_fill');print('auto_fill', bool(af), af.get('selection') if af else None)"
